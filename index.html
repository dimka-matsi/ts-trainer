<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#3178C6" />
    <script>
      // Тема до первой отрисовки: сохранённый выбор, иначе системная. Ключ — как в src/state/theme.ts.
      try {
        var t = localStorage.getItem("ts-trainer-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Тренажёр TypeScript</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%233178C6'/><text x='94' y='92' text-anchor='end' font-family='monospace' font-weight='700' font-size='52' fill='white'>TS</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Onest:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
